[project]
name = "agent-lab"
version = "0.1.0"
requires-python = "==3.15.2"
dependencies = ["jsonschema==4.26.0"]

[dependency-groups]
dev = ["ruff==0.17.3"]
training = ["torch==2.15.0", "transformers==5.21.0", "peft==0.21.2", "huggingface-hub==2.3.0"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["benchmarks/repositories", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
