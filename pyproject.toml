[project]
name = "agent-lab"
version = "0.1.0"
requires-python = "==3.14.4"
dependencies = ["jsonschema==4.26.0"]

[dependency-groups]
dev = ["ruff==0.16.9"]
training = ["torch==2.14.0", "transformers==5.17.0", "peft==0.21.2", "huggingface-hub==1.33.0"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["benchmarks/repositories", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
