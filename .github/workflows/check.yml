name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic:
    name: merge-ready
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.8'
      - run: python -m pip install uv==0.11.21
      - run: uv sync --locked
      - run: make check
        env:
          TZ: UTC
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '0'
